name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use the patched Node instead of Playwright's bundled runtime.
      PLAYWRIGHT_NODEJS_PATH: node
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Test external publication scheduler
        run: node --test scheduler/worker.test.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Test cover and unfolded layouts
        run: python tests/browser_check.py
