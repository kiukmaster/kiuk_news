name: Update news & deploy
run-name: News ${{ inputs.scheduled_slot || 'scheduled' }} ${{ inputs.publish_at || github.event.schedule || inputs.mode || 'manual' }}

env:
  TZ: Asia/Seoul

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect: 수집·배포 / rebuild: 재배포 / check-api: 연결 / check-curation: 저장 후보 전체 선별 검사'
        type: choice
        options:
          - collect
          - rebuild
          - check-api
          - check-curation
        default: collect
      scheduled_slot:
        description: '외부 예약 실행용 게시 시각 (KST). 직접 실행은 manual'
        type: choice
        options:
          - manual
          - '06:00'
          - '13:00'
          - '19:00'
        default: manual
      publish_at:
        description: '외부 예약의 공개 목표 ISO 시각. 예: 2026-10-01T13:00:00+09:00'
        type: string
        required: false
        default: ''
  schedule:
    # KST 공개 목표 53분 전에 수집하고 같은 runner에서 목표까지 대기합니다.
    - cron: '7 5 * * *'   # 05:07 준비 → 06:00 공개
      timezone: Asia/Seoul
    - cron: '7 12 * * *'  # 12:07 준비 → 13:00 공개
      timezone: Asia/Seoul
    - cron: '7 18 * * *'  # 18:07 준비 → 19:00 공개
      timezone: Asia/Seoul

permissions:
  contents: read

concurrency:
  group: news-${{ (inputs.mode == 'check-api' || inputs.mode == 'check-curation') && 'diagnostic' || 'publish' }}-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  check-api:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'check-api' || inputs.mode == 'check-curation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Gemini key, models and selection schemas without publishing
        if: inputs.mode == 'check-api'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_HOT_MODEL: ${{ vars.GEMINI_HOT_MODEL }}
        run: python -u -m digest --check-api
      - name: Restore candidates for read-only selection diagnostic
        if: inputs.mode == 'check-curation'
        run: python scripts/state_branch.py restore --dir diagnostic-state
      - name: Check full saved candidate pool without publishing
        if: inputs.mode == 'check-curation'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_HOT_MODEL: ${{ vars.GEMINI_HOT_MODEL }}
        run: python -u -m digest --check-curation --state-dir diagnostic-state

  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.mode != 'check-api' && inputs.mode != 'check-curation' && !(github.event_name == 'schedule' && vars.EXTERNAL_SCHEDULER_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve publication time from original run
        id: publication
        if: inputs.mode != 'check-api' && (github.event_name == 'schedule' || inputs.scheduled_slot == '06:00' || inputs.scheduled_slot == '13:00' || inputs.scheduled_slot == '19:00' || inputs.publish_at != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SCHEDULE_TIMEZONE: Asia/Seoul
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          REQUESTED_PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          RUN_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export RUN_CREATED_AT
          python -m digest.publication plan

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check secret configuration
        if: inputs.mode != 'rebuild'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import os; assert os.environ.get('GEMINI_API_KEY','').strip(), 'GEMINI_API_KEY repository secret를 등록하세요.'"

      - name: Check Gemini key and models without publishing
        if: inputs.mode == 'check-api'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_HOT_MODEL: ${{ vars.GEMINI_HOT_MODEL }}
        run: python -u -m digest --check-api

      - name: Restore persistent data
        id: restore
        if: inputs.mode != 'check-api'
        run: python scripts/state_branch.py restore --dir state

      - name: Collect, summarize, select HOT, generate HTML
        id: collect
        if: inputs.mode != 'rebuild' && inputs.mode != 'check-api'
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_HOT_MODEL: ${{ vars.GEMINI_HOT_MODEL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          PUBLISH_AT: ${{ steps.publication.outputs.publish_at }}
        run: |
          case "${SCHEDULED_SLOT:-manual}" in
            '06:00') slot_cron='7 5 * * *' ;;
            '13:00') slot_cron='7 12 * * *' ;;
            '19:00') slot_cron='7 18 * * *' ;;
            manual|'') slot_cron="${SCHEDULE_CRON:-}" ;;
            *) echo "Unknown scheduled slot: $SCHEDULED_SLOT" >&2; exit 1 ;;
          esac
          python -u -m digest --schedule "$slot_cron" --state-dir state --output public

      - name: Rebuild without API calls
        if: inputs.mode == 'rebuild'
        run: python -u -m digest --build-only --state-dir state --output public

      - name: Save persistent data
        if: always() && steps.restore.outcome == 'success'
        run: python scripts/state_branch.py save --dir state

      - name: Configure Pages
        if: inputs.mode != 'check-api'
        uses: actions/configure-pages@v5

      - name: Upload generated site only
        if: inputs.mode != 'check-api'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1

      - name: Wait for scheduled publication time
        if: inputs.mode != 'check-api' && steps.publication.outputs.publish_at != ''
        env:
          PUBLISH_AT: ${{ steps.publication.outputs.publish_at }}
        run: python -m digest.publication wait

      - name: Deploy Pages
        if: inputs.mode != 'check-api'
        id: deployment
        uses: actions/deploy-pages@v4
