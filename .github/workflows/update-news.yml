name: Update news & deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect: 수집·요약·배포 / rebuild: API 호출 없이 재배포'
        type: choice
        options:
          - collect
          - rebuild
        default: collect
  schedule:
    # UTC -> 한국시간(UTC+9). 실제 실행은 GitHub 상황에 따라 지연될 수 있습니다.
    - cron: '0 21 * * *'  # 다음 날짜 06:00 KST
    - cron: '0 4 * * *'   # 13:00 KST
    - cron: '0 10 * * *'  # 19:00 KST

permissions:
  contents: read

concurrency:
  group: news-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==9.0.2
      - name: Run tests
        run: python -m pytest -q
      - name: Check secret configuration
        if: inputs.mode != 'rebuild'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import os; assert os.environ.get('GEMINI_API_KEY','').strip(), 'GEMINI_API_KEY repository secret를 등록하세요.'"
      - name: Restore persistent data
        id: restore
        run: python scripts/state_branch.py restore --dir state
      - name: Collect, summarize, select HOT, generate HTML
        id: collect
        if: inputs.mode != 'rebuild'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_HOT_MODEL: ${{ vars.GEMINI_HOT_MODEL }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m digest --state-dir state --output public
      - name: Rebuild without API calls
        if: inputs.mode == 'rebuild'
        run: python -m digest --build-only --state-dir state --output public
      - name: Save persistent data
        if: always() && steps.restore.outcome == 'success'
        run: python scripts/state_branch.py save --dir state
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
